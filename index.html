<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Muscle Car - Open World Drive</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }
#ui {
  position: fixed; top: 20px; left: 20px; color: #fff;
  font-size: 14px; z-index: 10; pointer-events: none;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}
#speedometer {
  position: fixed; bottom: 30px; right: 30px;
  color: #fff; font-size: 48px; font-weight: bold;
  text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  z-index: 10; pointer-events: none;
}
#speedometer span { font-size: 18px; color: #ffaa44; }
#controls {
  position: fixed; bottom: 20px; left: 20px;
  color: rgba(255,255,255,0.7); font-size: 12px;
  z-index: 10; pointer-events: none;
  background: rgba(0,0,0,0.4); padding: 10px 14px;
  border-radius: 8px; backdrop-filter: blur(6px);
}
#minimap {
  position: fixed; top: 20px; right: 20px;
  width: 150px; height: 150px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50%; overflow: hidden;
  z-index: 10; pointer-events: none;
  background: rgba(0,0,0,0.3);
}
#loading {
  position: fixed; inset: 0; background: #111;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; color: #fff; z-index: 100;
  transition: opacity 0.8s;
}
#loading h1 { font-size: 36px; margin-bottom: 10px; color: #ff8844; }
#loading p { color: #aaa; font-size: 16px; }
.bar { width: 300px; height: 4px; background: #333; margin-top: 20px; border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, #ff6600, #ffaa00); width: 0%; transition: width 0.3s; }
</style>
</head>
<body>

<div id="loading">
  <h1> Muscle Car Drive</h1>
  <p>Şehir yükleniyor...</p>
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
</div>

<div id="ui">
  <div style="font-size:18px;font-weight:bold;color:#ffaa44;">️ Muscle Car</div>
  <div id="gearInfo">Vites: N</div>
  <div id="posInfo"></div>
</div>

<div id="speedometer">0 <span>km/h</span></div>

<div id="controls">
  <b>Kontroller:</b><br>
  W / ↑ — Gaz<br>
  S / ↓ — Fren / Geri<br>
  A / ↑ — Sol<br>
  D / → — Sağ<br>
  Space — El Freni<br>
  C — Kamera Değiştir<br>
  R — Sıfırla
</div>

<canvas id="minimap"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============ GAME ENGINE ============
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// ============ SUNSET SKY ============
function createSky() {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, '#1a0a2e');
  grad.addColorStop(0.2, '#4a1942');
  grad.addColorStop(0.4, '#c84b31');
  grad.addColorStop(0.55, '#ecb365');
  grad.addColorStop(0.7, '#ff8c42');
  grad.addColorStop(0.85, '#ff6b35');
  grad.addColorStop(1, '#2d1b4e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 512);
  // Sun
  const sunGrad = ctx.createRadialGradient(256, 300, 10, 256, 300, 80);
  sunGrad.addColorStop(0, 'rgba(255,220,100,1)');
  sunGrad.addColorStop(0.5, 'rgba(255,140,50,0.6)');
  sunGrad.addColorStop(1, 'rgba(255,80,20,0)');
  ctx.fillStyle = sunGrad;
  ctx.fillRect(0, 0, 512, 512);
  // Clouds
  for (let i = 0; i < 8; i++) {
    const cx = Math.random() * 512;
    const cy = 150 + Math.random() * 150;
    const cw = 60 + Math.random() * 100;
    const ch = 15 + Math.random() * 20;
    ctx.fillStyle = `rgba(255,${150+Math.random()*80},${100+Math.random()*50},0.3)`;
    ctx.beginPath();
    ctx.ellipse(cx, cy, cw, ch, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(canvas);
  const skyGeo = new THREE.SphereGeometry(900, 32, 32);
  const skyMat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);
  return sky;
}
const sky = createSky();

// ============ LIGHTING ============
const ambientLight = new THREE.AmbientLight(0x443355, 0.4);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xff8844, 1.8);
sunLight.position.set(-100, 60, -80);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 500;
sunLight.shadow.camera.left = -100;
sunLight.shadow.camera.right = 100;
sunLight.shadow.camera.top = 100;
sunLight.shadow.camera.bottom = -100;
scene.add(sunLight);

const hemiLight = new THREE.HemisphereLight(0xff8844, 0x221133, 0.3);
scene.add(hemiLight);

// Street lights glow
const streetLightColor = 0xffaa44;

// ============ GROUND / ROADS ============
const GROUND_SIZE = 800;
const BLOCK_SIZE = 60;
const ROAD_WIDTH = 16;

// Ground
const groundGeo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Road texture
function createRoadTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#333';
  ctx.fillRect(0, 0, 256, 256);
  // Center line
  ctx.strokeStyle = '#ffcc00';
  ctx.lineWidth = 3;
  ctx.setLineDash([20, 15]);
  ctx.beginPath();
  ctx.moveTo(128, 0);
  ctx.lineTo(128, 256);
  ctx.stroke();
  // Edge lines
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(10, 0); ctx.lineTo(10, 256);
  ctx.moveTo(246, 0); ctx.lineTo(246, 256);
  ctx.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, 4);
  return tex;
}

// Create road grid
const roads = [];
const halfBlocks = Math.floor(GROUND_SIZE / 2 / BLOCK_SIZE);

for (let i = -halfBlocks; i <= halfBlocks; i++) {
  // Horizontal roads
  const hRoadGeo = new THREE.PlaneGeometry(GROUND_SIZE, ROAD_WIDTH);
  const hRoadMat = new THREE.MeshStandardMaterial({ map: createRoadTexture(), roughness: 0.7 });
  const hRoad = new THREE.Mesh(hRoadGeo, hRoadMat);
  hRoad.rotation.x = -Math.PI / 2;
  hRoad.position.set(0, 0.01, i * BLOCK_SIZE);
  hRoad.receiveShadow = true;
  scene.add(hRoad);
  roads.push(hRoad);

  // Vertical roads
  const vRoadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, GROUND_SIZE);
  const vRoadMat = new THREE.MeshStandardMaterial({ map: createRoadTexture(), roughness: 0.7 });
  const vRoad = new THREE.Mesh(vRoadGeo, vRoadMat);
  vRoad.rotation.x = -Math.PI / 2;
  vRoad.position.set(i * BLOCK_SIZE, 0.01, 0);
  vRoad.receiveShadow = true;
  scene.add(vRoad);
  roads.push(vRoad);
}

// Sidewalks
function createSidewalk(x, z, w, d) {
  const geo = new THREE.BoxGeometry(w, 0.15, d);
  const mat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.8 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, 0.075, z);
  mesh.receiveShadow = true;
  scene.add(mesh);
}

// ============ BUILDINGS ============
const buildings = [];
const buildingColors = [0x445566, 0x556677, 0x334455, 0x667788, 0x3a4a5a, 0x4a5a6a, 0x2a3a4a, 0x5a6a7a];

function createBuilding(x, z, w, d, h) {
  const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6, metalness: 0.1 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, h / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  buildings.push({ mesh, x, z, w, d, h });

  // Windows
  const winRows = Math.floor(h / 4);
  const winCols = Math.floor(w / 5);
  for (let r = 0; r < winRows; r++) {
    for (let c = 0; c < winCols; c++) {
      const lit = Math.random() > 0.4;
      const winColor = lit ? 0xffdd88 : 0x223344;
      const winGeo = new THREE.PlaneGeometry(2, 2.5);
      const winMat = new THREE.MeshStandardMaterial({
        color: winColor,
        emissive: lit ? 0xffaa44 : 0x000000,
        emissiveIntensity: lit ? 0.5 : 0
      });
      // Front
      const win = new THREE.Mesh(winGeo, winMat);
      win.position.set(x - w/2 + 3 + c * 5, 2 + r * 4, z + d/2 + 0.05);
      scene.add(win);
      // Back
      const win2 = win.clone();
      win2.position.z = z - d/2 - 0.05;
      win2.rotation.y = Math.PI;
      scene.add(win2);
    }
  }

  // Roof detail
  if (Math.random() > 0.5) {
    const roofGeo = new THREE.BoxGeometry(w * 0.3, 3, d * 0.3);
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.set(x, h + 1.5, z);
    roof.castShadow = true;
    scene.add(roof);
  }
}

// Generate city blocks
for (let bx = -halfBlocks; bx < halfBlocks; bx++) {
  for (let bz = -halfBlocks; bz < halfBlocks; bz++) {
    const cx = bx * BLOCK_SIZE + BLOCK_SIZE / 2;
    const cz = bz * BLOCK_SIZE + BLOCK_SIZE / 2;
    const margin = ROAD_WIDTH / 2 + 2;
    const availW = BLOCK_SIZE - ROAD_WIDTH - 4;
    const availD = BLOCK_SIZE - ROAD_WIDTH - 4;

    if (availW < 10 || availD < 10) continue;

    const numBuildings = 1 + Math.floor(Math.random() * 3);
    for (let b = 0; b < numBuildings; b++) {
      const bw = 10 + Math.random() * (availW / numBuildings - 2);
      const bd = 10 + Math.random() * (availD / numBuildings - 2);
      const bh = 15 + Math.random() * 60;
      const ox = (Math.random() - 0.5) * (availW - bw);
      const oz = (Math.random() - 0.5) * (availD - bd);
      createBuilding(cx + ox, cz + oz, bw, bd, bh);
    }

    // Sidewalks around block
    createSidewalk(cx, cz - availD/2 - 1, availW + 4, 2);
    createSidewalk(cx, cz + availD/2 + 1, availW + 4, 2);
  }
}

// ============ STREET LIGHTS ============
function createStreetLight(x, z) {
  const poleGeo = new THREE.CylinderGeometry(0.15, 0.2, 8, 8);
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8 });
  const pole = new THREE.Mesh(poleGeo, poleMat);
  pole.position.set(x, 4, z);
  pole.castShadow = true;
  scene.add(pole);

  const armGeo = new THREE.BoxGeometry(3, 0.2, 0.2);
  const arm = new THREE.Mesh(armGeo, poleMat);
  arm.position.set(x + 1.5, 8, z);
  scene.add(arm);

  const bulbGeo = new THREE.SphereGeometry(0.4, 8, 8);
  const bulbMat = new THREE.MeshStandardMaterial({
    color: 0xffaa44, emissive: 0xff8800, emissiveIntensity: 2
  });
  const bulb = new THREE.Mesh(bulbGeo, bulbMat);
  bulb.position.set(x + 3, 7.8, z);
  scene.add(bulb);

  const light = new THREE.PointLight(0xffaa44, 0.8, 25);
  light.position.set(x + 3, 7.5, z);
  scene.add(light);
}

for (let i = -halfBlocks; i <= halfBlocks; i++) {
  for (let j = -halfBlocks; j <= halfBlocks; j++) {
    if (Math.random() > 0.6) {
      createStreetLight(i * BLOCK_SIZE + ROAD_WIDTH/2 + 1, j * BLOCK_SIZE);
    }
  }
}

// ============ CAR MODEL ============
function createCar() {
  const carGroup = new THREE.Group();

  const bodyColor = 0x8B7355; // Bronze/brown like the reference
  const chromeColor = 0xcccccc;
  const glassColor = 0x88aacc;
  const darkColor = 0x222222;

  // Main body - lower
  const bodyGeo = new THREE.BoxGeometry(2.2, 0.7, 5.2);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: bodyColor, roughness: 0.3, metalness: 0.7
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.55;
  body.castShadow = true;
  carGroup.add(body);

  // Body - upper (cabin area)
  const cabinGeo = new THREE.BoxGeometry(2.0, 0.65, 2.4);
  const cabinMat = new THREE.MeshStandardMaterial({
    color: bodyColor, roughness: 0.3, metalness: 0.7
  });
  const cabin = new THREE.Mesh(cabinGeo, cabinMat);
  cabin.position.set(0, 1.15, -0.3);
  cabin.castShadow = true;
  carGroup.add(cabin);

  // Windshield front
  const wsGeo = new THREE.PlaneGeometry(1.8, 0.55);
  const wsMat = new THREE.MeshStandardMaterial({
    color: glassColor, roughness: 0.1, metalness: 0.3,
    transparent: true, opacity: 0.6
  });
  const ws = new THREE.Mesh(wsGeo, wsMat);
  ws.position.set(0, 1.2, 0.85);
  ws.rotation.x = -0.3;
  carGroup.add(ws);

  // Windshield back
  const ws2 = ws.clone();
  ws2.position.set(0, 1.2, -1.5);
  ws2.rotation.x = 0.3;
  carGroup.add(ws2);

  // Side windows
  for (let side = -1; side <= 1; side += 2) {
    const swGeo = new THREE.PlaneGeometry(2.2, 0.5);
    const sw = new THREE.Mesh(swGeo, wsMat);
    sw.position.set(side * 1.01, 1.2, -0.3);
    sw.rotation.y = side * Math.PI / 2;
    carGroup.add(sw);
  }

  // Hood scoops (two squares on hood)
  for (let side = -1; side <= 1; side += 2) {
    const scoopGeo = new THREE.BoxGeometry(0.35, 0.08, 0.35);
    const scoopMat = new THREE.MeshStandardMaterial({ color: darkColor, roughness: 0.5 });
    const scoop = new THREE.Mesh(scoopGeo, scoopMat);
    scoop.position.set(side * 0.45, 0.94, 1.5);
    carGroup.add(scoop);
  }

  // Antenna
  const antGeo = new THREE.CylinderGeometry(0.02, 0.02, 1.2, 8);
  const antMat = new THREE.MeshStandardMaterial({ color: chromeColor, metalness: 0.9 });
  const ant = new THREE.Mesh(antGeo, antMat);
  ant.position.set(0.5, 1.7, -0.5);
  carGroup.add(ant);

  const antBallGeo = new THREE.SphereGeometry(0.06, 8, 8);
  const antBall = new THREE.Mesh(antBallGeo, antMat);
  antBall.position.set(0.5, 2.3, -0.5);
  carGroup.add(antBall);

  // Headlights
  for (let side = -1; side <= 1; side += 2) {
    const hlGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.1, 16);
    const hlMat = new THREE.MeshStandardMaterial({
      color: 0xffffee, emissive: 0xffee88, emissiveIntensity: 0.5
    });
    const hl = new THREE.Mesh(hlGeo, hlMat);
    hl.rotation.x = Math.PI / 2;
    hl.position.set(side * 0.7, 0.55, 2.6);
    carGroup.add(hl);
  }

  // Taillights
  for (let side = -1; side <= 1; side += 2) {
    const tlGeo = new THREE.BoxGeometry(0.4, 0.15, 0.05);
    const tlMat = new THREE.MeshStandardMaterial({
      color: 0xff2200, emissive: 0xff0000, emissiveIntensity: 0.8
    });
    const tl = new THREE.Mesh(tlGeo, tlMat);
    tl.position.set(side * 0.7, 0.55, -2.6);
    carGroup.add(tl);
  }

  // Chrome bumpers
  const bumperMat = new THREE.MeshStandardMaterial({ color: chromeColor, metalness: 0.95, roughness: 0.1 });

  const fBumperGeo = new THREE.BoxGeometry(2.3, 0.2, 0.15);
  const fBumper = new THREE.Mesh(fBumperGeo, bumperMat);
  fBumper.position.set(0, 0.35, 2.65);
  carGroup.add(fBumper);

  const rBumperGeo = new THREE.BoxGeometry(2.3, 0.2, 0.15);
  const rBumper = new THREE.Mesh(rBumperGeo, bumperMat);
  rBumper.position.set(0, 0.35, -2.65);
  carGroup.add(rBumper);

  // Exhaust pipes
  for (let side = -1; side <= 1; side += 2) {
    const exGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.3, 8);
    const exMat = new THREE.MeshStandardMaterial({ color: 0x666666, metalness: 0.9 });
    const ex = new THREE.Mesh(exGeo, exMat);
    ex.rotation.x = Math.PI / 2;
    ex.position.set(side * 0.5, 0.2, -2.7);
    carGroup.add(ex);
  }

  // Wheels
  const wheels = [];
  const wheelPositions = [
    { x: -1.1, z: 1.5 },
    { x: 1.1, z: 1.5 },
    { x: -1.1, z: -1.5 },
    { x: 1.1, z: -1.5 }
  ];

  wheelPositions.forEach(pos => {
    const wheelGroup = new THREE.Group();

    // Tire
    const tireGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.3, 24);
    const tireMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
    const tire = new THREE.Mesh(tireGeo, tireMat);
    tire.rotation.z = Math.PI / 2;
    tire.castShadow = true;
    wheelGroup.add(tire);

    // Rim
    const rimGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.32, 16);
    const rimMat = new THREE.MeshStandardMaterial({ color: chromeColor, metalness: 0.95, roughness: 0.1 });
    const rim = new THREE.Mesh(rimGeo, rimMat);
    rim.rotation.z = Math.PI / 2;
    wheelGroup.add(rim);

    // Rim spokes
    for (let s = 0; s < 5; s++) {
      const spokeGeo = new THREE.BoxGeometry(0.04, 0.35, 0.34);
      const spoke = new THREE.Mesh(spokeGeo, rimMat);
      spoke.rotation.x = (s / 5) * Math.PI;
      wheelGroup.add(spoke);
    }

    // Hub cap
    const hubGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.33, 12);
    const hub = new THREE.Mesh(hubGeo, rimMat);
    hub.rotation.z = Math.PI / 2;
    wheelGroup.add(hub);

    wheelGroup.position.set(pos.x, 0.42, pos.z);
    carGroup.add(wheelGroup);
    wheels.push(wheelGroup);
  });

  // Side mirrors
  for (let side = -1; side <= 1; side += 2) {
    const mirrorGeo = new THREE.BoxGeometry(0.15, 0.12, 0.2);
    const mirrorMat = new THREE.MeshStandardMaterial({ color: bodyColor, metalness: 0.7 });
    const mirror = new THREE.Mesh(mirrorGeo, mirrorMat);
    mirror.position.set(side * 1.15, 1.1, 0.5);
    carGroup.add(mirror);
  }

  // Door lines
  const doorLineMat = new THREE.MeshStandardMaterial({ color: 0x665544, roughness: 0.5 });
  for (let side = -1; side <= 1; side += 2) {
    const dlGeo = new THREE.BoxGeometry(0.02, 0.5, 1.8);
    const dl = new THREE.Mesh(dlGeo, doorLineMat);
    dl.position.set(side * 1.11, 0.7, 0.2);
    carGroup.add(dl);
  }

  carGroup.userData.wheels = wheels;
  return carGroup;
}

const car = createCar();
car.position.set(0, 0, 0);
scene.add(car);

// ============ CAR PHYSICS ============
const physics = {
  speed: 0,
  maxSpeed: 80,
  acceleration: 25,
  braking: 35,
  friction: 8,
  steering: 0,
  maxSteering: 0.6,
  steeringSpeed: 2.5,
  steeringReturn: 3.0,
  angle: 0,
  drift: 0,
  handbrake: false
};

const keys = {};
document.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.code] = false; });

let cameraMode = 0; // 0: third person, 1: close, 2: hood
const cameraModes = 3;

// ============ PARTICLES (tire smoke) ============
const particles = [];
function createSmoke(x, y, z) {
  const geo = new THREE.SphereGeometry(0.15 + Math.random() * 0.2, 6, 6);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xaaaaaa, transparent: true, opacity: 0.4
  });
  const p = new THREE.Mesh(geo, mat);
  p.position.set(x, y, z);
  p.userData.life = 1.0;
  p.userData.vel = new THREE.Vector3(
    (Math.random() - 0.5) * 2,
    Math.random() * 1.5,
    (Math.random() - 0.5) * 2
  );
  scene.add(p);
  particles.push(p);
}

// ============ MINIMAP ============
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas.getContext('2d');
minimapCanvas.width = 150;
minimapCanvas.height = 150;

function drawMinimap() {
  minimapCtx.clearRect(0, 0, 150, 150);
  minimapCtx.fillStyle = 'rgba(20,20,30,0.8)';
  minimapCtx.beginPath();
  minimapCtx.arc(75, 75, 73, 0, Math.PI * 2);
  minimapCtx.fill();

  const scale = 0.15;
  const cx = 75, cy = 75;

  // Roads
  minimapCtx.strokeStyle = '#555';
  minimapCtx.lineWidth = 2;
  for (let i = -halfBlocks; i <= halfBlocks; i++) {
    const rx = cx + (i * BLOCK_SIZE - car.position.x) * scale;
    const ry = cy + (i * BLOCK_SIZE - car.position.z) * scale;
    minimapCtx.beginPath();
    minimapCtx.moveTo(rx - 100, ry);
    minimapCtx.lineTo(rx + 100, ry);
    minimapCtx.stroke();
    minimapCtx.beginPath();
    minimapCtx.moveTo(rx, ry - 100);
    minimapCtx.lineTo(rx, ry + 100);
    minimapCtx.stroke();
  }

  // Buildings
  minimapCtx.fillStyle = '#445';
  buildings.forEach(b => {
    const bx = cx + (b.x - car.position.x) * scale;
    const by = cy + (b.z - car.position.z) * scale;
    if (bx > 5 && bx < 145 && by > 5 && by < 145) {
      minimapCtx.fillRect(bx - b.w * scale / 2, by - b.d * scale / 2, b.w * scale, b.d * scale);
    }
  });

  // Car
  minimapCtx.save();
  minimapCtx.translate(cx, cy);
  minimapCtx.rotate(-physics.angle);
  minimapCtx.fillStyle = '#ff6600';
  minimapCtx.beginPath();
  minimapCtx.moveTo(0, -6);
  minimapCtx.lineTo(-4, 4);
  minimapCtx.lineTo(4, 4);
  minimapCtx.closePath();
  minimapCtx.fill();
  minimapCtx.restore();
}

// ============ CAMERA SHAKE ============
let shakeAmount = 0;

// ============ GAME LOOP ============
const clock = new THREE.Clock();
let loadingDone = false;

function update(dt) {
  if (!loadingDone) return;

  // Input
  const gas = keys['KeyW'] || keys['ArrowUp'];
  const brake = keys['KeyS'] || keys['ArrowDown'];
  const left = keys['KeyA'] || keys['ArrowLeft'];
  const right = keys['KeyD'] || keys['ArrowRight'];
  const handbrake = keys['Space'];
  const resetKey = keys['KeyR'];
  const camKey = keys['KeyC'];

  if (resetKey) {
    car.position.set(0, 0, 0);
    physics.speed = 0;
    physics.angle = 0;
    physics.steering = 0;
  }

  // Camera toggle (debounce)
  if (camKey && !camKey._pressed) {
    cameraMode = (cameraMode + 1) % cameraModes;
    camKey._pressed = true;
  }
  if (!camKey) { 
    // reset pressed state
  }

  // Acceleration
  if (gas) {
    physics.speed += physics.acceleration * dt;
  } else if (brake) {
    if (physics.speed > 0) {
      physics.speed -= physics.braking * dt;
    } else {
      physics.speed -= physics.acceleration * 0.5 * dt;
    }
  } else {
    // Friction
    if (physics.speed > 0) {
      physics.speed -= physics.friction * dt;
      if (physics.speed < 0) physics.speed = 0;
    } else if (physics.speed < 0) {
      physics.speed += physics.friction * dt;
      if (physics.speed > 0) physics.speed = 0;
    }
  }

  // Handbrake
  if (handbrake) {
    physics.speed *= 0.97;
    physics.drift += dt * 2;
    if (Math.abs(physics.speed) > 5) {
      // Create smoke
      const wheelPos = car.userData.wheels;
      if (wheelPos) {
        wheelPos.forEach(w => {
          const worldPos = new THREE.Vector3();
          w.getWorldPosition(worldPos);
          if (Math.random() > 0.5) createSmoke(worldPos.x, worldPos.y, worldPos.z);
        });
      }
    }
  } else {
    physics.drift *= 0.95;
  }

  // Speed limits
  physics.speed = Math.max(-physics.maxSpeed * 0.3, Math.min(physics.maxSpeed, physics.speed));

  // Steering
  if (left) {
    physics.steering += physics.steeringSpeed * dt;
  } else if (right) {
    physics.steering -= physics.steeringSpeed * dt;
  } else {
    // Return to center
    if (physics.steering > 0) {
      physics.steering -= physics.steeringReturn * dt;
      if (physics.steering < 0) physics.steering = 0;
    } else if (physics.steering < 0) {
      physics.steering += physics.steeringReturn * dt;
      if (physics.steering > 0) physics.steering = 0;
    }
  }
  physics.steering = Math.max(-physics.maxSteering, Math.min(physics.maxSteering, physics.steering));

  // Apply steering (only when moving)
  const speedFactor = Math.min(Math.abs(physics.speed) / 20, 1);
  physics.angle += physics.steering * speedFactor * dt * (physics.speed >= 0 ? 1 : -1);

  // Move car
  const moveX = Math.sin(physics.angle) * physics.speed * dt;
  const moveZ = Math.cos(physics.angle) * physics.speed * dt;
  car.position.x += moveX;
  car.position.z += moveZ;

  // Car rotation
  car.rotation.y = physics.angle;

  // Car tilt on steering
  car.rotation.z = -physics.steering * speedFactor * 0.05;
  car.rotation.x = -physics.speed * 0.001; // slight pitch on acceleration

  // Wheel rotation
  const wheelSpeed = physics.speed * dt * 3;
  if (car.userData.wheels) {
    car.userData.wheels.forEach((w, i) => {
      w.children.forEach(child => {
        if (child.geometry && child.geometry.type === 'CylinderGeometry') {
          child.rotation.x += wheelSpeed;
        }
      });
      // Front wheels steer
      if (i < 2) {
        w.rotation.y = physics.steering * 0.5;
      }
    });
  }

  // Camera shake
  shakeAmount = Math.abs(physics.speed) / physics.maxSpeed * 0.02;

  // Camera follow
  updateCamera(dt);

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.life -= dt * 1.5;
    p.position.add(p.userData.vel.clone().multiplyScalar(dt));
    p.userData.vel.y -= dt * 2;
    p.material.opacity = p.userData.life * 0.4;
    p.scale.multiplyScalar(1 + dt * 2);
    if (p.userData.life <= 0) {
      scene.remove(p);
      particles.splice(i, 1);
    }
  }

  // Update UI
  const speedKmh = Math.abs(Math.round(physics.speed * 3.6));
  document.getElementById('speedometer').innerHTML = `${speedKmh} <span>km/h</span>`;

  let gear = 'N';
  if (physics.speed > 1) gear = Math.min(6, Math.floor(physics.speed / 13) + 1);
  else if (physics.speed < -1) gear = 'R';
  document.getElementById('gearInfo').textContent = `Vites: ${gear}`;
  document.getElementById('posInfo').textContent = `X: ${Math.round(car.position.x)}m  Z: ${Math.round(car.position.z)}m`;

  // Minimap
  drawMinimap();
}

function updateCamera(dt) {
  const carPos = car.position.clone();
  let camOffset, camLookOffset;

  switch (cameraMode) {
    case 0: // Third person - far
      camOffset = new THREE.Vector3(
        -Math.sin(physics.angle) * 8,
        4,
        -Math.cos(physics.angle) * 8
      );
      camLookOffset = new THREE.Vector3(0, 1, 0);
      break;
    case 1: // Close third person
      camOffset = new THREE.Vector3(
        -Math.sin(physics.angle) * 4,
        2.5,
        -Math.cos(physics.angle) * 4
      );
      camLookOffset = new THREE.Vector3(0, 0.8, 0);
      break;
    case 2: // Hood / first person
      camOffset = new THREE.Vector3(
        Math.sin(physics.angle) * 0.5,
        1.5,
        Math.cos(physics.angle) * 0.5
      );
      camLookOffset = new THREE.Vector3(
        Math.sin(physics.angle) * 10,
        1,
        Math.cos(physics.angle) * 10
      );
      break;
  }

  const targetPos = carPos.clone().add(camOffset);
  // Add shake
  targetPos.x += (Math.random() - 0.5) * shakeAmount;
  targetPos.y += (Math.random() - 0.5) * shakeAmount;

  camera.position.lerp(targetPos, 5 * dt);

  const lookAt = carPos.clone().add(camLookOffset);
  const currentLook = new THREE.Vector3();
  camera.getWorldDirection(currentLook);
  const targetLook = lookAt.clone().sub(camera.position).normalize();
  currentLook.lerp(targetLook, 5 * dt);
  camera.lookAt(camera.position.clone().add(currentLook));
}

// ============ LOADING ============
let loadProgress = 0;
const loadInterval = setInterval(() => {
  loadProgress += 5 + Math.random() * 10;
  if (loadProgress >= 100) {
    loadProgress = 100;
    clearInterval(loadInterval);
    setTimeout(() => {
      document.getElementById('loading').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
      }, 800);
      loadingDone = true;
    }, 500);
  }
  document.getElementById('barFill').style.width = loadProgress + '%';
}, 100);

// ============ RESIZE ============
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============ RENDER LOOP ============
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}
animate();
</script>
